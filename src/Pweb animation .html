<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pweb wordmark animation</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{    margin: 0;
    width: 100%;
    max-height: 100%;}
body{background:transparent;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.layout{display:grid;grid-template-columns:1fr minmax(0,300px) 1fr;gap:24px;align-items:center;width:100%;max-width:1500px;min-height:100%;margin:0 auto;padding:24px;box-sizing:border-box}
.stage{display:flex;flex-direction:column;align-items:center;transition:opacity .6s}
.stage.fade{opacity:0}
.stage svg{width:100%;height:auto;display:block}
.stage svg.word{max-width:300px;margin-top:-2px}
.stage svg.web{max-width:360px;margin-top:-6px}
.side{min-height:120px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.stage{order:-1}}
.play .d{stroke-dasharray:1 2;animation:dr var(--s,.5s) ease-out var(--t,0s) both}
.play .stem{transform-box:fill-box;transform-origin:50% 0;animation:grow .6s ease-out .4s both}
.play .eye{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1) var(--t) both}
.play .layer{animation:ext 1.1s cubic-bezier(.2,.8,.2,1) var(--t) both}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ext{from{opacity:0;transform:translate(0,0)}to{opacity:var(--o,1);transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.play *{animation-duration:.01s!important;animation-delay:0s!important}}

.play .ol{stroke-dasharray:1 2;animation:dr var(--s) ease-in-out var(--t) both,so .3s linear var(--f) both}
.play .fl{animation:fi .7s ease-out var(--f) both}
.ol{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes so{from{opacity:1}to{opacity:0}}
.stage svg.word{margin-top:18px;max-width:260px}
</style>
</head>

function layer(color,dx,dy,t,o){var g=document.createElementNS(NS,'g');g.setAttribute('class','layer');g.style.color=color;g.style.setProperty('--dx',dx+'px');g.style.setProperty('--dy',dy+'px');g.style.setProperty('--t',t+'s');if(o)g.style.setProperty('--o',o);var c=shape.cloneNode(true);c.removeAttribute('id');g.appendChild(c);stack.appendChild(g);}
