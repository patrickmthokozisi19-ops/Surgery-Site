<head>
<meta charset="utf-8">

<title>Pweb logo animation</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  background:transparent;
}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,580px) minmax(0,1fr);gap:24px;align-items:center;width:100%;max-width:1500px;min-height:100%;margin:0 auto;padding:24px;box-sizing:border-box}.stage.fade{opacity:0}
.stage svg{width:100%;height:auto;display:block}
.stage svg.word{max-width:300px;margin-top:-2px}
.stage svg.web{max-width:360px;margin-top:-6px}
.side{min-height:120px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.stage{order:-1}}
.play .d{stroke-dasharray:1 2;animation:dr var(--s,.5s) ease-out var(--t,0s) both}
.play .stem{transform-box:fill-box;transform-origin:50% 0;animation:grow .6s ease-out .4s both}
.play .eye{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1) var(--t) both}
.play .layer{animation:ext 1.1s cubic-bezier(.2,.8,.2,1) var(--t) both}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ext{from{opacity:0;transform:translate(0,0)}to{opacity:var(--o,1);transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.play *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

<script>
var svg=document.getElementById('s'),logo=document.getElementById('logo'),stack=document.getElementById('stack');
var cols=['#4a6d65','#51746c','#587b73','#5f827a','#678981','#6f9088','#78978f','#819e96','#8aa59e','#94aca5','#9eb3ad','#a8bbb5','#b3c4be','#bdcdc8'];
var NS='http://www.w3.org/2000/svg';
function layer(color,dx,dy,t,o){
  var g=document.createElementNS(NS,'g');
  g.setAttribute('class','layer');
  g.style.color=color;
  g.style.setProperty('--dx',dx+'px');
  g.style.setProperty('--dy',dy+'px');
  g.style.setProperty('--t',t+'s');
  if(o)g.style.setProperty('--o',o);
  var c=logo.cloneNode(true);c.removeAttribute('id');
  g.appendChild(c);stack.appendChild(g);
}
layer('#2f4a44',36,50,5.4,0.2);
for(var k=0;k<14;k++){var i=14-k;layer(cols[k],1.5*i,2*i,5.4+k*0.04);}
var stage=document.getElementById('stage');
function play(){stage.classList.remove('play');void stage.getBoundingClientRect();stage.classList.add('play');}
function cycle(){stage.classList.remove('fade');play();setTimeout(function(){stage.classList.add('fade');},11500);setTimeout(cycle,12200);}
cycle();
</script>
