<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pweb devices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Chivo+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* ===== EDIT HERE: page + text styles ===== */
:root{--page:#070b14;--font:'Space Grotesk',system-ui,sans-serif;--mono:'Chivo Mono',ui-monospace,monospace;--frame:#1c2433;--edge:#2e3a50;--fade:.7s}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#e8edf5}}
:root[data-theme="light"]{--page:#e8edf5}
:root[data-theme="dark"]{--page:#070b14}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}
svg{width:100%;max-width:1000px;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
text{font-family:var(--font);fill:#fff}
.dk{fill:#0b1220}.lt{fill:#fff}.lime{fill:#93c5fd}.c{text-anchor:middle}
.eyebrow{font:600 14px var(--mono);letter-spacing:2.5px}
.big{font-weight:700;font-size:70px;letter-spacing:-3px}
.h2{font-weight:700;font-size:34px;letter-spacing:-1px}
.sub{font-weight:500;font-size:20px}
.lbl{font-weight:500;font-size:14px}
.card-t{font-weight:700;font-size:18px}
.pbig{font-weight:700;font-size:44px;letter-spacing:-2px}
.ph2{font-weight:700;font-size:26px;letter-spacing:-.5px}
.psub{font-weight:500;font-size:13px}
.prow{font-weight:700;font-size:15px}
/* ===== slide engine ===== */
.slide{transition:transform var(--fade) cubic-bezier(.65,0,.25,1),opacity var(--fade);pointer-events:none}
.slide.active{pointer-events:auto}
.tile,.btn,.dot{cursor:pointer}.tile:hover,.btn:hover{opacity:.85}
.dot{transition:all .3s}
.float{animation:float 7s ease-in-out infinite}.phone .float{animation-delay:-3.5s}
.device:hover .float,.device:focus-within .float,.device.hold .float{animation-play-state:paused}
@keyframes float{50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
.device{outline:none}
</style>
</head>
<body>
<!--
 HOW TO EDIT
 - Each <g class="slide"> is one slide.
 - data-duration="5000"  -> how long it stays (ms)
 - data-color="#3b82f6"  -> the colour of its circle at the bottom (match the slide)
 - Add/remove slides freely; circles + timing are automatic.
 - Hover/touch/drag a device = it pauses. Swipe/drag left-right, click the circles, or use arrow keys.
-->
<svg viewBox="0 0 1000 640" role="img" aria-label="Pweb surgical practice booking site on a laptop, developer portfolio on a phone">
<defs>
  <clipPath id="lc"><rect width="580" height="340" rx="6"/></clipPath>
  <clipPath id="pc"><rect width="186" height="396" rx="26"/></clipPath>
  <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
  <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000" flood-opacity=".5"/></filter>
  <path id="gh" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
  <path id="ml" d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1.5 2.2V8l7.5 5 7.5-5v-.8L12 12.2 4.5 7.2z"/>
</defs>

<g class="device phone" tabindex="0">

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}

  document.querySelectorAll('.device').forEach(function(dev){
    var sl=[].slice.call(dev.querySelectorAll('.slide')), n=sl.length;
    var screen=dev.querySelector('.screen'), bar=dev.querySelector('.bar'), dg=dev.querySelector('.dots');
    var W=+dg.getAttribute('data-w'), Y=+dg.getAttribute('data-y');
    var idx=0, elapsed=0, last=null, hold=false, down=false, sx=0, swiped=false;

    /* circles: one per slide, coloured with the slide's data-color */
    var pw=(n-1)*20+30, x0=W/2-(n-1)*10;
    dg.appendChild(mk('rect',{x:W/2-pw/2,y:Y-12,width:pw,height:24,rx:12,fill:'rgba(0,0,0,.55)'}));
    var dots=sl.map(function(s,k){
      var c=mk('circle',{cx:x0+k*20,cy:Y,r:5,fill:s.getAttribute('data-color'),'class':'dot'});
      c.addEventListener('click',function(e){e.stopPropagation();go(k)});
      dg.appendChild(c);return c});

    function dur(){return +sl[idx].getAttribute('data-duration')||4000}

    function go(i){
      idx=((i%n)+n)%n; elapsed=0;
      sl.forEach(function(s,k){
        var d=((k-idx)%n+n)%n; if(d>n/2)d-=n;
        s.style.transform='translateX('+(d*W)+'px)';
        s.style.opacity=Math.abs(d)>1?0:1;
        s.classList.toggle('active',d===0);
      });
      dots.forEach(function(c,k){
        c.setAttribute('r',k===idx?7:5);
        c.setAttribute('stroke',k===idx?'#fff':'none');
        c.setAttribute('stroke-width',2);
      });
    }

    function setHold(v){hold=v;dev.classList.toggle('hold',v)}
    dev.addEventListener('mouseenter',function(){setHold(true)});
    dev.addEventListener('mouseleave',function(){if(!down)setHold(false)});
    dev.addEventListener('focusin',function(){setHold(true)});
    dev.addEventListener('focusout',function(){setHold(false)});

    /* swipe / drag */
    screen.addEventListener('pointerdown',function(e){down=true;sx=e.clientX;swiped=false;setHold(true)});
    window.addEventListener('pointerup',function(e){
      if(!down)return; down=false;
      var dx=e.clientX-sx;
      if(Math.abs(dx)>28){swiped=true;go(idx+(dx<0?1:-1));setTimeout(function(){swiped=false},80)}
      if(!dev.matches(':hover'))setHold(false);
    });
    window.addEventListener('pointercancel',function(){down=false});
    dev.addEventListener('click',function(e){if(swiped){e.preventDefault();e.stopPropagation()}},true);
    dev.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight')go(idx+1); if(e.key==='ArrowLeft')go(idx-1);
    });

    function tick(t){
      if(last!==null&&!hold)elapsed+=t-last;
      last=t;
      if(elapsed>=dur())go(idx+1);
      bar.setAttribute('width',W*Math.min(elapsed/dur(),1));
      requestAnimationFrame(tick);
    }
    go(0);requestAnimationFrame(tick);
  });
})();
</script>
</body>
</html>
