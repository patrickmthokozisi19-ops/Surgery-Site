<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="760" viewBox="0 0 1200 760"
     role="img" aria-labelledby="title desc">

  <title id="title">Pweb floating devices advertisement</title>
  <desc id="desc">An animated desktop monitor and smartphone with transparent background.</desc>

  <defs>
    <!-- Screen gloss -->
    <linearGradient id="screenGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#edf0ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#e8ebf0"/>
      <stop offset=".7" stop-color="#c7cbd3"/>
      <stop offset="1" stop-color="#f8f9fb"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fafc"/>
      <stop offset=".5" stop-color="#aeb3bd"/>
      <stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2635FF"/>
      <stop offset="1" stop-color="#6470ff"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="pcScreenClip">
      <rect x="142" y="137" width="690" height="430" rx="13"/>
    </clipPath>

    <clipPath id="phoneScreenClip">
      <rect x="897" y="213" width="196" height="424" rx="28"/>
    </clipPath>

    <!-- Gloss sweep -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".72"/>
      <stop offset=".56" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- =========================================================
       TRANSPARENT BACKGROUND
       Nothing is drawn behind the devices.
       ========================================================= -->

  <!-- Floating blue energy line -->
  <g fill="none" stroke="#2635FF" stroke-linecap="round" opacity=".9">
    <path d="M92 315 C25 230, 145 145, 230 245 C285 310, 215 370, 115 350"
          stroke-width="5" filter="url(#softGlow)">
      <animate attributeName="stroke-dasharray"
               values="0 900;260 640;0 900"
               dur="5s" repeatCount="indefinite"/>
    </path>

    <path d="M1008 330 C1125 270, 1180 390, 1085 455 C1020 500, 1080 565, 1160 575"
          stroke-width="4" opacity=".75">
      <animate attributeName="stroke-dashoffset"
               values="0;-500;0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===================== PC ===================== -->
  <g id="pweb-pc">

    <!-- PC floating animation -->
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0; 0 -12; 0 0"
      dur="5s"
      repeatCount="indefinite"/>

    <!-- soft floating shadow/glow -->
    <ellipse cx="495" cy="678" rx="320" ry="24"
             fill="#2635FF" opacity=".12" filter="url(#shadow)">
      <animate attributeName="rx"
               values="320;285;320"
               dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- monitor outer body -->
    <rect x="125" y="120" width="724" height="470" rx="24"
          fill="url(#edge)" stroke="#b7bbc4" stroke-width="3"/>

    <!-- black bezel -->
    <rect x="134" y="129" width="706" height="446" rx="17"
          fill="#11131a"/>

    <!-- white screen -->
    <rect x="142" y="137" width="690" height="430" rx="13"
          fill="url(#screenGloss)"/>

    <!-- ================= EDITABLE PC SCREEN ================= -->
    <g id="pc-screen-content" clip-path="url(#pcScreenClip)">

      <!-- EDIT THESE SVG TEXT ELEMENTS -->
      <text x="195" y="225"
            font-family="Arial, Helvetica, sans-serif"
            font-size="20"
            font-weight="800"
            letter-spacing="5"
            fill="#2635FF">PWEB</text>

      <text x="195" y="305"
            font-family="Arial, Helvetica, sans-serif"
            font-size="62"
            font-weight="800"
            letter-spacing="-3"
            fill="#11131a">BUILD.</text>

      <text x="195" y="365"
            font-family="Arial, Helvetica, sans-serif"
            font-size="62"
            font-weight="800"
            letter-spacing="-3"
            fill="#11131a">CREATE.</text>

      <text x="195" y="425"
            font-family="Arial, Helvetica, sans-serif"
            font-size="62"
            font-weight="800"
            letter-spacing="-3"
            fill="#2635FF">LAUNCH.</text>

      <text x="197" y="468"
            font-family="Arial, Helvetica, sans-serif"
            font-size="18"
            fill="#667085">Traditional coding. Modern experiences.</text>

      <!-- clickable button -->
      <a xlink:href="https://example.com"
         href="https://example.com"
         target="_blank"
         rel="noopener">
        <rect x="195" y="495" width="150" height="45" rx="23"
              fill="#2635FF">
          <animate attributeName="opacity"
                   values="1;.75;1" dur="2.4s"
                   repeatCount="indefinite"/>
        </rect>
        <text x="270" y="524"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="15"
              font-weight="700"
              fill="#fff">VISIT PWEB</text>
      </a>

      <!-- decorative UI cards -->
      <rect x="620" y="220" width="150" height="92" rx="16"
            fill="#f2f4ff"/>
      <rect x="620" y="332" width="150" height="92" rx="16"
            fill="#eef0f5"/>
      <circle cx="650" cy="251" r="14" fill="#2635FF"/>
      <circle cx="650" cy="363" r="14" fill="#11131a"/>

      <rect x="675" y="242" width="68" height="8" rx="4" fill="#2635FF" opacity=".35"/>
      <rect x="675" y="261" width="48" height="7" rx="3.5" fill="#98a0b3"/>

      <rect x="675" y="354" width="68" height="8" rx="4" fill="#11131a" opacity=".2"/>
      <rect x="675" y="373" width="48" height="7" rx="3.5" fill="#98a0b3"/>

    </g>

    <!-- screen gloss animation -->
    <rect x="142" y="137" width="690" height="430"
          fill="url(#shine)" opacity=".7"
          clip-path="url(#pcScreenClip)">
      <animate attributeName="x"
               values="-600;850;-600"
               dur="6s"
               repeatCount="indefinite"/>
    </rect>

    <!-- webcam -->
    <circle cx="487" cy="125" r="4" fill="#30333b"/>

    <!-- monitor stand -->
    <path d="M405 590 L570 590 L595 665 L380 665 Z"
          fill="url(#metal)" stroke="#b7bbc4" stroke-width="2"/>

    <!-- monitor base -->
    <ellipse cx="487" cy="675" rx="150" ry="14"
             fill="url(#metal)" stroke="#b7bbc4" stroke-width="2"/>

  </g>

  <!-- ===================== PHONE ===================== -->
  <g id="pweb-phone">

    <animateTransform attributeName="transform"
      type="rotate"
      values="5 995 425; 8 995 425; 5 995 425"
      dur="4.5s"
      repeatCount="indefinite"/>

    <!-- phone body -->
    <rect x="880" y="195" width="230" height="460" rx="38"
          fill="url(#metal)"
          stroke="#aeb3bd"
          stroke-width="3"/>

    <!-- black bezel -->
    <rect x="888" y="203" width="214" height="444" rx="32"
          fill="#0e1015"/>

    <!-- screen -->
    <rect x="897" y="213" width="196" height="424" rx="28"
          fill="url(#screenGloss)"/>

    <!-- ================= EDITABLE PHONE SCREEN ================= -->
    <g id="phone-screen-content" clip-path="url(#phoneScreenClip)">

      <text x="995" y="295"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="19"
            font-weight="900"
            fill="#2635FF">Pweb</text>

      <text x="995" y="360"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="38"
            font-weight="800"
            letter-spacing="-2"
            fill="#11131a">CODE.</text>

      <text x="995" y="402"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="38"
            font-weight="800"
            letter-spacing="-2"
            fill="#2635FF">CREATE.</text>

      <text x="995" y="444"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="38"
            font-weight="800"
            letter-spacing="-2"
            fill="#11131a">SHIP.</text>

      <text x="995" y="480"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="11"
            fill="#667085">Ideas into real websites.</text>

      <!-- clickable phone link -->
      <a xlink:href="https://example.com"
         href="https://example.com"
         target="_blank"
         rel="noopener">
        <rect x="936" y="505" width="118" height="38" rx="19"
              fill="#2635FF"/>
        <text x="995" y="529"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
              font-weight="700"
              fill="#fff">EXPLORE →</text>
      </a>

    </g>

    <!-- phone shine -->
    <rect x="897" y="213" width="196" height="424"
          fill="url(#shine)" opacity=".65"
          clip-path="url(#phoneScreenClip)">
      <animate attributeName="x"
               values="650;1120;650"
               dur="4.5s"
               repeatCount="indefinite"/>
    </rect>

    <!-- notch -->
    <rect x="955" y="218" width="80" height="22" rx="11"
          fill="#0a0b0e"/>

    <circle cx="1018" cy="229" r="3" fill="#252a35"/>

  </g>

  <!-- subtle Pweb blue pulse -->
  <circle cx="600" cy="105" r="5" fill="#2635FF">
    <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/>
  </circle>

</svg>
