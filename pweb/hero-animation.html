<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pweb hero animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: transparent;
      overflow-x: hidden;
    }

    body.stage-page {
      padding-block: 0.5rem;
      color: #fff;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
      background: transparent;

      & p {
        color: rgba(255, 255, 255, 0.75);
      }

      & a {
        color: inherit;
        text-decoration: none;
      }

      & :focus-visible {
        outline: 3px solid #5fd3b3;
        outline-offset: 2px;
      }

      & .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.95rem 1.5rem;
        border: 1px solid transparent;
        border-radius: 999px;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;

        &:hover {
          transform: translateY(-2px);
        }
      }

      & .btn-primary {
        background: #5fd3b3;
        color: #0e1f2b;

        &:hover {
          background: #83e4cb;
        }
      }

      & .stage {
        display: grid;
      }

      & .scene {
        display: grid;
        grid-area: 1 / 1;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.8s ease, visibility 0.8s;

        &.is-on {
          opacity: 1;
          visibility: visible;
        }
      }

      /* scene 1: wordmark */
      & .scene-brand {
        justify-items: center;
        align-content: center;
        gap: clamp(0.8rem, 2.5vh, 1.6rem);
        text-align: center;

        & .wordmark {
          width: min(100%, 640px);
          height: auto;
          overflow: visible;
        }

        & .wm-shape {
          color: #a4b1c4;
        }

        & .ol {
          fill: none;
          stroke: currentColor;
          stroke-width: 1.8;
          stroke-linejoin: round;
        }

        & .tag {
          font-size: clamp(1rem, 1.6vw, 1.2rem);
          font-weight: 500;
        }

        & .web {
          width: min(70%, 300px);
          height: auto;
        }

        &.play {
          & .d {
            stroke-dasharray: 1 2;
            animation: pwDraw var(--s, 0.5s) ease-out var(--t, 0s) both;
          }

          & .ol {
            stroke-dasharray: 1 2;
            animation: pwDraw var(--s) ease-in-out var(--t) both, pwOut 0.3s linear var(--f) both;
          }

          & .fl {
            animation: pwFade 0.7s ease-out var(--f) both;
          }

          & .layer {
            animation: pwExt 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) var(--t) both;
          }

          & .eye {
            transform-box: fill-box;
            transform-origin: center;
            animation: pwPop 0.35s cubic-bezier(0.3, 1.6, 0.5, 1) var(--t) both;
          }

          & .tag {
            animation: pwFade 1s ease-out 5.4s both;
          }
        }
      }

      /* scene 2: copy + devices */
      & .scene-product {
        grid-template-columns: minmax(0, 4fr) minmax(0, 8fr);
        gap: clamp(1.5rem, 4vw, 4rem);

        & .copy {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 1.4rem;
        }

        & .hl {
          color: #fff;
          font-size: clamp(2.1rem, 4.2vw, 3.5rem);
          font-weight: 700;
          line-height: 1.05;
          letter-spacing: -0.035em;
          text-wrap: balance;
        }

        & .about-lead {
          max-width: 46ch;
          font-size: clamp(1rem, 1.5vw, 1.1rem);
          line-height: 1.75;
        }

        & .pw-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 0.8rem;
        }

        & .btn-ghost {
          border-color: rgba(255, 255, 255, 0.35);
          color: #fff;

          &:hover {
            border-color: #5fd3b3;
            background: rgba(255, 255, 255, 0.08);
          }
        }

        & .devices {
          width: 100%;
          height: auto;
          touch-action: pan-y;
          user-select: none;
          -webkit-user-select: none;

          fill: #fff;

          & text {
            font-family: inherit;
          }

          & .h { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
          & .big { font-size: 40px; font-weight: 700; letter-spacing: -1.5px; }
          & .m { font-size: 13px; font-weight: 600; }
          & .s { font-size: 12px; font-weight: 500; }
          & .xs { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
          & .c { text-anchor: middle; }
          & .ink { fill: #0e1f2b; }
          & .mute { fill: #5b6b75; }
          & .wh { fill: #fff; }
          & .acc { fill: #5fd3b3; }
          & .deep { fill: #1b6b58; }
          & .amber { fill: #8a5f10; }
          & .slate { fill: #3a4b5c; }
          & .soft { fill: rgba(255, 255, 255, 0.7); }

          & .slide {
            pointer-events: none;
            transition: transform 0.7s cubic-bezier(0.65, 0, 0.25, 1), opacity 0.7s;

            &.active {
              pointer-events: auto;
            }

            &.active .rise {
              animation: pwRise 0.6s ease-out var(--d, 0s) both;
            }

            &.active .pulse {
              transform-box: fill-box;
              transform-origin: center;
              animation: pwPulse 2.4s ease-in-out 1.6s infinite;
            }

            &.active .growx {
              transform-box: fill-box;
              transform-origin: 0 50%;
              animation: pwGrowX 1.1s ease-out 0.7s both;
            }
          }

          & .sel {
            opacity: 0;
          }

          & .slide.active .sel {
            animation: pwSel 4.5s linear var(--d, 0s) infinite;
          }

          & .tile,
          & .btn,
          & .dot {
            cursor: pointer;
          }

          & .tile:hover {
            opacity: 0.85;
          }

          & .dot {
            transition: all 0.3s;
          }

          & .device {
            outline: none;
          }

          & .float {
            animation: pwFloat 7s ease-in-out infinite;
          }

          & .phone .float {
            animation-delay: -3.5s;
          }

          & .device:is(:hover, :focus-within, .hold) .float {
            animation-play-state: paused;
          }
        }
      }

      @media (max-width: 900px) {
        & .scene-product {
          grid-template-columns: minmax(0, 1fr);
          align-content: center;

          & .copy {
            align-items: center;
            text-align: center;
          }

          & .pw-actions {
            justify-content: center;
          }
        }
      }

      @media (max-width: 640px) {
        & .pw-actions .btn {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        & .float {
          animation: none;
        }

        & .scene {
          transition: none;
        }
      }
    }


    @keyframes pwDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes pwOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes pwFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pwPop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes pwExt {
      from { opacity: 0; transform: translate(0, 0); }
      to { opacity: 1; transform: translate(var(--dx), var(--dy)); }
    }
    @keyframes pwRise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pwPulse { 50% { transform: scale(1.04); } }
    @keyframes pwGrowX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pwSel {
      0%, 33% { opacity: 1; }
      34%, 100% { opacity: 0; }
    }
    @keyframes pwFloat { 50% { transform: translateY(-14px); } }

  </style>
</head>
